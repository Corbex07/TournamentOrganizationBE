name: CD

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]
    branches: ["main", "CD-testing"]

  workflow_dispatch:

jobs:
  debug-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Debug workflow trigger
        env:
          CI_NAME: ${{ github.event.workflow_run.name }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "CI workflow: $CI_NAME"
          echo "CI branch: $CI_BRANCH"
          echo "CI result: $CI_RESULT"