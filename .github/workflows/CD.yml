name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Create secret files
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-secrets"
          umask 077
          printf '%s' "$DB_PASSWORD" > "$RUNNER_TEMP/deploy-secrets/db_password.txt"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/deploy-secrets/api_key.txt"

      - name: Transfer secrets to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "mkdir -p /opt/myapp/secrets"

          scp "$RUNNER_TEMP/deploy-secrets/"*.txt \
            "$VM_USER@$VM_HOST:/opt/myapp/secrets/"

          ssh "$VM_USER@$VM_HOST" \
            "chmod 600 /opt/myapp/secrets/*.txt"

    
