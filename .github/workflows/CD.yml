name: CD

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]
    branches: ["CD-testing"]


permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build-docker-image:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'CD-testing' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: TournamentOrganizationBE-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:cd-testing" \
            -t "$IMAGE:$COMMIT_SHA" .

      - name: Verify Docker Image
        run: docker image inspect "$IMAGE:cd-testing"

      - name: Push Docker image to GHCR
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker push "$IMAGE:cd-testing"
          docker push "$IMAGE:$COMMIT_SHA"

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Docker
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -T "$VM_USER@$VM_HOST" \
            "sudo -n docker stack deploy \
            --with-registry-auth \
            -c - tournament" < docker-compose.yml

      - name: Deploy Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

        run: |
          set -euo pipefail
          
          # Check that database password exists
          test -n "$DB_PASSWORD"
          
          # Create project directory on server
          ssh -T "$VM_USER@$VM_HOST" \
            'mkdir -p "$HOME/tournament"'
          
          # Copy Compose file to server
          scp docker-compose.yml \
            "$VM_USER@$VM_HOST:tournament/docker-compose.yml"
          
          # Authenticate server with GHCR
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -T "$VM_USER@$VM_HOST" \
              "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          
          # Pass DB password securely and deploy
          printf '%s\n' "$DB_PASSWORD" |
            ssh -T "$VM_USER@$VM_HOST" '
              set -eu
              IFS= read -r DB_PASSWORD
              export DB_PASSWORD
          
              cd "$HOME/tournament"
              docker compose up -d --pull always
              docker compose ps
            '
