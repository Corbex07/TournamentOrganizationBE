name: CD

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]
    branches: ["main"]


permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build-docker-image:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: TournamentOrganizationBE-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:main" \
            -t "$IMAGE:$COMMIT_SHA" .

      - name: Verify Docker Image
        run: docker image inspect "$IMAGE:main"

      - name: Push Docker image to GHCR
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker push "$IMAGE:main"
          docker push "$IMAGE:$COMMIT_SHA"


  deploy:
    name: Deploy to personal server

    needs: build-docker-image

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    concurrency:
      group: tournament-staging-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy with Docker Compose
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

        run: |
          set -euo pipefail
      
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
          -u "$GHCR_USER" --password-stdin
      
          docker compose -p tournament \
          up -d --pull always --no-build
  
