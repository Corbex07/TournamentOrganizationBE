name: CD

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]
    branches: ["CD-testing"]

jobs:
  build-docker-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'CD-testing' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest