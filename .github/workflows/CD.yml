name: CD

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types: [completed]
    branches: ["CD-testing"]


permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build-docker-image:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'CD-testing' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: TournamentOrganizationBE-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:cd-testing" \
            -t "$IMAGE:$COMMIT_SHA" .

      - name: Verify Docker Image
        run: docker image inspect "$IMAGE:cd-testing"

      - name: Push Docker image to GHCR
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker push "$IMAGE:cd-testing"
          docker push "$IMAGE:$COMMIT_SHA"

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Recreate Swarm secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}

        # runs with secure bash via set -euo pipefail (e = exit on error, u = undefined are errors o pipefail = catch errors in pipelines
        run: |
          set -euo pipefail 
          test -n "$DB_PASSWORD"

          ssh "$VM_USER@$VM_HOST" \
            "if sudo -n docker secret inspect tournament_db_password >/dev/null 2>&1; then
              sudo -n docker secret rm tournament_db_password
            fi"

          printf '%s' "$DB_PASSWORD" |
            ssh "$VM_USER@$VM_HOST" \
              "sudo -n docker secret create tournament_db_password -"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy Docker Swarm stack
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -T "$VM_USER@$VM_HOST" \
            "sudo -n docker stack deploy \
            --with-registry-auth \
            -c - tournament" < docker-compose.yml
